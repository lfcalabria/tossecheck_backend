name: Deploy TosseCheck API

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Sincronizar arquivos via FTP
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /repositories/tossecheck_backend/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.env
          **/venv/**
          **/__pycache__/**
          **/*.pyc
          **/db.sqlite3
    
    - name: Executar migrações via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/tecnologia/repositories/tossecheck_backend
          source /home/tecnologia/virtualenv/repositories/tossecheck_backend/3.12/bin/activate
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
